<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_design.css">
<style>
  /* <Project> technical architecture, version 1.
     PLAN (edit this, then the markup):
       canvas 1900 x 840; top band icon centre y 142; rows: r1 322 · r2 442 · r3 586 · r4 706
       columns per box: <box>: 440 · 528 · 616 · 704 ...
       corridors: y 254 (above row 1, under the top band), y 530 (between r2 and r3 boxes)
     Rules: one icon + one name per node; boxes sized to content with >= 16 px between them;
     wires icon edge to icon edge, orthogonal, >= 24 px visible shaft, labels beside wires
     never on a border. Icons: icons/<provider>/<name>.svg fetched by scripts/fetch_icons.sh. */
  body{width:1900px;height:840px;background:radial-gradient(1400px 800px at 30% 20%,#12304A,#0B1F33 60%,#081726);color:#F1F4F5}
  .ttl{position:absolute;left:0;right:0;top:14px;text-align:center;font-family:var(--mono);font-size:18px;font-weight:600;letter-spacing:3.6px;text-transform:uppercase;color:#F1F4F5}
  .legend{position:absolute;right:28px;top:20px;display:flex;gap:14px;align-items:center;font-size:10.5px;color:rgba(241,244,245,.75)}
  .legend span{display:flex;align-items:center;gap:5px}
  .grp{position:absolute;border:1.5px dashed rgba(143,201,214,.38);border-radius:12px}
  .grp.solid{border-style:solid;border-color:rgba(143,201,214,.4)}
  .glab{position:absolute;display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:#CFE3EA;background:#0E2740;padding:2px 8px 2px 4px;border-radius:6px;z-index:2}
  .glab img{width:18px;height:18px;display:block}
  .glab .sub{font-family:var(--font);font-size:9.5px;font-weight:500;letter-spacing:0;text-transform:none;color:rgba(241,244,245,.6)}
  .glab.c{background:transparent;padding:0;justify-content:center}
  .glab.c .gi{display:flex;align-items:center;gap:7px;background:#0E2740;padding:2px 8px 2px 4px;border-radius:6px}
  .node{position:absolute;width:100px;margin-left:-50px;text-align:center;z-index:1}
  .node.w84{width:84px;margin-left:-42px}
  .node .ico{width:44px;height:44px;margin:0 auto;display:flex;align-items:center;justify-content:center}
  .node .ico img{width:44px;height:44px;display:block;border-radius:6px}
  .node .ico img.mark{width:40px;height:40px;border-radius:0}
  .node .lb{font-size:10.5px;font-weight:600;line-height:1.2;margin-top:10px;color:#F1F4F5;display:inline-block;padding:1px 0}
  .note{position:absolute;font-size:9.5px;color:rgba(241,244,245,.62);line-height:1.4;z-index:1}
  .vpill{position:absolute;background:#0B1F33;border:1.5px dashed #E25B50;border-radius:20px;padding:10px 6px;font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:1.5px;color:#F2A59D;writing-mode:vertical-rl;transform:rotate(180deg);z-index:2}
  svg.wires{position:absolute;left:0;top:0;width:1900px;height:840px;pointer-events:none;z-index:0}
  svg.wires > path{fill:none;stroke:#8FC9D6;stroke-width:2}
  svg.wires circle{fill:#8FC9D6}
  svg.wires text{font-family:"Geist Mono",Menlo,monospace;font-size:9px;font-weight:600;fill:#CFE3EA;letter-spacing:.4px}
  svg.wires rect.lbg{fill:#0E2740;rx:4}
</style></head>
<body>

<div class="ttl">Project technical architecture on Cloud</div>
<div class="legend">
  <span><svg width="26" height="10"><line x1="0" y1="5" x2="18" y2="5" stroke="#8FC9D6" stroke-width="2"/><polygon points="18,1.5 25,5 18,8.5" fill="#8FC9D6"/></svg> call · data flow</span>
  <span><svg width="24" height="10"><line x1="0" y1="5" x2="24" y2="5" stroke="#E25B50" stroke-width="2" stroke-dasharray="5 4"/></svg> trust boundary</span>
  <span><span style="width:11px;height:11px;border:1.5px dashed rgba(143,201,214,.55);border-radius:3px;display:inline-block"></span> group</span>
</div>

<!-- wires: icon edge to icon edge (icons 44 px: edges are centre ± 22) -->
<svg class="wires" viewBox="0 0 1900 840">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8FC9D6"/></marker>
  </defs>
  <!-- example: node A (centre 440,322) -> node B (centre 528,322), label above the wire -->
  <path d="M462,322 H506" marker-end="url(#ah)"/>
  <rect class="lbg" x="466" y="304" width="36" height="13"/><text x="471" y="313.5">call</text>
  <!-- fan-out: one trunk with junction dots, one arrowhead per target -->
  <!-- <path d="M550,322 H640 V254 H925 V298" marker-end="url(#ah)"/><circle cx="925" cy="254" r="3"/> -->
</svg>

<!-- outer boxes and the cloud box -->
<div class="grp solid" style="left:210px;top:66px;width:1676px;height:754px;border-radius:14px"></div>
<div class="glab" style="left:222px;top:58px"><img src="icons/aws/group-aws-cloud-dark.svg" alt="">Cloud · region <span class="sub">· one line of facts</span></div>

<!-- one group with two nodes: box sized to content, chip on the top border -->
<div class="grp" style="left:396px;top:276px;width:220px;height:120px"></div>
<div class="glab" style="left:406px;top:268px"><img src="icons/aws/group-private-subnet.svg" alt="">Application</div>
<div class="node w84" style="left:440px;top:300px"><div class="ico"><img class="mark" src="icons/nginx.svg" alt=""></div><div class="lb">Web UI (nginx)</div></div>
<div class="node w84" style="left:528px;top:300px"><div class="ico"><img class="mark" src="icons/fastapi.svg" alt=""></div><div class="lb">API (FastAPI)</div></div>

</body></html>
